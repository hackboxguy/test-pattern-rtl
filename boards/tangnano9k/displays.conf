# Tang Nano 9K — fixed-timing display profiles (build with PANEL=<name>).
# Transcribed (the RTL subset) from docs/video-timings.md — keep in sync with the
# Pi tooling's display-configs.conf. The rPLL dividers are SOLVED at build time
# from PIXMHZ (serial = 5 x pixel); no divider column here.
#
# Most panels exceed the Tang Nano 9K emulated-LVDS (~325 MHz serial clean) and/or
# its rPLL (600 MHz CLKOUT max) -- they build/are flagged for a faster board.
# Only 12.3 / 12.3-nq1 (~472 MHz serial) are rPLL-buildable here (over the cliff).
#
# name      HACT HFP HSY HBP   VACT VFP VSY VBP   HPOL VPOL   PIXMHZ   ZONES
12.3        1920 50  50  50    720  21  2   18    0    0      94.52    40
12.3-nq1    1920 50  50  54    720  21  2   18    0    0      94.52    40
